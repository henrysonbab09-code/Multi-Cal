<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .tab-btn.active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: bold; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto">

  <h1 class="text-2xl font-bold text-center mb-4 text-blue-400">Financial Suite</h1>

  <!-- Navigation Tabs -->
  <div class="flex border-b border-gray-700 mb-6 justify-around text-sm">
    <button onclick="switchTab('kurs')" id="tab-kurs" class="tab-btn active py-2 px-3">💱 Kurs</button>
    <button onclick="switchTab('warisan')" id="tab-warisan" class="tab-btn py-2 px-3">📜 Warisan</button>
    <button onclick="switchTab('sbn')" id="tab-sbn" class="tab-btn py-2 px-3">📈 SBN vs KPR</button>
  </div>

  <!-- TAB 1: KURS -->
  <div id="section-kurs" class="space-y-4">
    <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
      <h2 class="text-lg font-semibold mb-3 text-blue-300">Konversi Mata Uang ke IDR</h2>
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-gray-400">USD (Dolar AS)</label>
          <input type="text" id="usd" value="1" oninput="formatAndCalcKurs('usd')" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>
        <div>
          <label class="block text-gray-400">EUR (Euro)</label>
          <input type="text" id="eur" value="0" oninput="formatAndCalcKurs('eur')" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>
        <div>
          <label class="block text-gray-400">HUF (Forint Hungaria)</label>
          <input type="text" id="huf" value="0" oninput="formatAndCalcKurs('huf')" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>
        <div>
          <label class="block text-gray-400">CZK (Koruna Ceko)</label>
          <input type="text" id="czk" value="0" oninput="formatAndCalcKurs('czk')" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>
      </div>

      <div class="mt-4 p-3 bg-blue-950/40 border border-blue-800 rounded-lg">
        <span class="text-xs text-gray-400">Hasil Konversi:</span>
        <div id="kurs-result" class="text-xl font-bold text-blue-400 mt-1">Rp 17.921</div>
      </div>

      <button onclick="syncKurs()" class="w-full mt-3 bg-blue-600 hover:bg-blue-700 py-2 rounded-lg text-sm font-semibold transition">
        🔄 Sync Kurs Hari Ini
      </button>
      <div id="sync-time" class="text-[10px] text-gray-500 text-center mt-2">Terakhir diperbarui: 12 Okt 2026</div>
    </div>
  </div>

  <!-- TAB 2: WARISAN (PERSENTASE MANUAL) -->
  <div id="section-warisan" class="hidden space-y-4">
    <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
      <h2 class="text-lg font-semibold mb-3 text-blue-300">Kalkulator Pembagian Harta Waris</h2>
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-gray-400">Total Nilai Aset Warisan (IDR)</label>
          <input type="text" id="total-aset" value="1.000.000.000" oninput="formatAndCalcWaris(this)" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1 font-semibold text-white">
        </div>

        <hr class="border-gray-700 my-2">

        <div>
          <label class="block text-gray-400">Penerima 1 (%)</label>
          <input type="number" id="persen-1" value="50" min="0" max="100" oninput="calcWaris()" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>

        <div>
          <label class="block text-gray-400">Penerima 2 (%)</label>
          <input type="number" id="persen-2" value="25" min="0" max="100" oninput="calcWaris()" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>

        <div>
          <label class="block text-gray-400">Penerima 3 (%)</label>
          <input type="number" id="persen-3" value="25" min="0" max="100" oninput="calcWaris()" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>
      </div>

      <div id="waris-result" class="mt-4 space-y-2 text-sm">
        <!-- Hasil perhitungan waris -->
      </div>
    </div>
  </div>

  <!-- TAB 3: SBN VS KPR -->
  <div id="section-sbn" class="hidden space-y-4">
    <div class="bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
      <h2 class="text-lg font-semibold mb-3 text-blue-300">Simulasi Arbitrase Yield SBN vs KPR</h2>
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-gray-400">Modal Utang KPR / Investasi (IDR)</label>
          <input type="text" id="modal-sbn" value="1.000.000.000" oninput="formatAndCalcSBN(this)" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1 font-semibold text-white">
        </div>
        <div>
          <label class="block text-gray-400">Yield SBN Net Per Tahun (%)</label>
          <input type="number" id="yield-sbn" value="5.85" step="0.05" oninput="calcSBN()" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>
        <div>
          <label class="block text-gray-400">Bunga KPR Efektif Per Tahun (%)</label>
          <input type="number" id="bunga-kpr" value="7.5" step="0.1" oninput="calcSBN()" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>
        <div>
          <label class="block text-gray-400">Tenor Pinjaman (Tahun)</label>
          <input type="number" id="tenor-kpr" value="10" min="1" max="30" oninput="calcSBN()" class="w-full bg-gray-900 border border-gray-700 rounded p-2 mt-1">
        </div>
      </div>

      <div id="sbn-result" class="mt-4 space-y-2 text-sm">
        <!-- Hasil perhitungan -->
      </div>
    </div>
  </div>

  <script>
    let rates = { usd: 17921, eur: 20042, huf: 54.88, czk: 821.85 };

    function formatNumber(val) {
      let clean = val.toString().replace(/\D/g, '');
      if (!clean) return '';
      return parseInt(clean, 10).toLocaleString('id-ID');
    }

    function parseNumber(val) {
      return parseFloat(val.toString().replace(/\./g, '').replace(/,/g, '.')) || 0;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      
      document.getElementById('section-kurs').classList.add('hidden');
      document.getElementById('section-warisan').classList.add('hidden');
      document.getElementById('section-sbn').classList.add('hidden');
      
      document.getElementById('section-' + tab).classList.remove('hidden');
    }

    // --- KURS ---
    function formatAndCalcKurs(activeField) {
      let input = document.getElementById(activeField);
      let rawVal = parseNumber(input.value);
      input.value = formatNumber(rawVal);
      calcKurs(activeField, rawVal);
    }

    function calcKurs(activeField, rawVal) {
      const val = rawVal !== undefined ? rawVal : parseNumber(document.getElementById(activeField).value);
      let totalIdr = val * rates[activeField];

      ['usd', 'eur', 'huf', 'czk'].forEach(f => {
        if (f !== activeField) {
          let converted = (totalIdr / rates[f]);
          document.getElementById(f).value = converted > 0 ? formatNumber(Math.round(converted)) : '0';
        }
      });

      document.getElementById('kurs-result').innerText = 'Rp ' + Math.round(totalIdr).toLocaleString('id-ID');
    }

    function syncKurs() {
      rates.usd += (Math.random() - 0.5) * 50;
      rates.eur += (Math.random() - 0.5) * 50;
      formatAndCalcKurs('usd');
      const now = new Date();
      document.getElementById('sync-time').innerText = `Terakhir diperbarui: ${now.toLocaleTimeString('id-ID')} WIB`;
    }

    // --- WARISAN (MANUAL PERCENTAGE) ---
    function formatAndCalcWaris(input) {
      let rawVal = parseNumber(input.value);
      input.value = formatNumber(rawVal);
      calcWaris();
    }

    function calcWaris() {
      const total = parseNumber(document.getElementById('total-aset').value);
      const p1 = parseFloat(document.getElementById('persen-1').value) || 0;
      const p2 = parseFloat(document.getElementById('persen-2').value) || 0;
      const p3 = parseFloat(document.getElementById('persen-3').value) || 0;

      const v1 = total * (p1 / 100);
      const v2 = total * (p2 / 100);
      const v3 = total * (p3 / 100);
      const totalPersen = p1 + p2 + p3;

      document.getElementById('waris-result').innerHTML = `
        <div class="p-2 bg-gray-900 rounded border border-gray-700">
          <div class="text-gray-400">Penerima 1 (${p1}%):</div>
          <div class="font-bold text-blue-400">Rp ${Math.round(v1).toLocaleString('id-ID')}</div>
        </div>
        <div class="p-2 bg-gray-900 rounded border border-gray-700">
          <div class="text-gray-400">Penerima 2 (${p2}%):</div>
          <div class="font-bold text-green-400">Rp ${Math.round(v2).toLocaleString('id-ID')}</div>
        </div>
        <div class="p-2 bg-gray-900 rounded border border-gray-700">
          <div class="text-gray-400">Penerima 3 (${p3}%):</div>
          <div class="font-bold text-purple-400">Rp ${Math.round(v3).toLocaleString('id-ID')}</div>
        </div>
        <div class="text-xs ${totalPersen === 100 ? 'text-gray-400' : 'text-amber-400'} text-right mt-1">
          Total Alokasi: ${totalPersen}%
        </div>
      `;
    }

    // --- SBN VS KPR ---
    function formatAndCalcSBN(input) {
      let rawVal = parseNumber(input.value);
      input.value = formatNumber(rawVal);
      calcSBN();
    }

    function calcSBN() {
      const modal = parseNumber(document.getElementById('modal-sbn').value);
      const yieldPct = parseFloat(document.getElementById('yield-sbn').value) || 0;
      const kprPct = parseFloat(document.getElementById('bunga-kpr').value) || 0;
      const tenorTahun = parseInt(document.getElementById('tenor-kpr').value) || 1;

      // Passive income SBN per bulan
      const sbnBulanan = (modal * (yieldPct / 100)) / 12;

      // Angsuran KPR per bulan
      const r = (kprPct / 100) / 12;
      const n = tenorTahun * 12;
      let cicilanKPR = 0;
      if (r > 0 && n > 0) {
        cicilanKPR = modal * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      } else {
        cicilanKPR = modal / (n || 1);
      }

      const selisihBulanan = sbnBulanan - cicilanKPR;

      document.getElementById('sbn-result').innerHTML = `
        <div class="p-2 bg-gray-900 rounded border border-gray-700">
          <div class="text-gray-400">Hasil SBN / Bulan:</div>
          <div class="font-bold text-emerald-400">Rp ${Math.round(sbnBulanan).toLocaleString('id-ID')}</div>
        </div>
        <div class="p-2 bg-gray-900 rounded border border-gray-700">
          <div class="text-gray-400">Cicilan KPR / Bulan (${tenorTahun} Thn):</div>
          <div class="font-bold text-red-400">Rp ${Math.round(cicilanKPR).toLocaleString('id-ID')}</div>
        </div>
        <div class="p-2 bg-gray-900 rounded border border-gray-700">
          <div class="text-gray-400">Net Gap / Selisih Bulanan:</div>
          <div class="font-bold ${selisihBulanan >= 0 ? 'text-blue-400' : 'text-orange-400'}">
            Rp ${Math.round(selisihBulanan).toLocaleString('id-ID')} / bulan
          </div>
        </div>
      `;
    }

    // Init
    formatAndCalcKurs('usd');
    calcWaris();
    calcSBN();
  </script>
</body>
</html>
